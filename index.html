<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lee opiniones reales de nuestros clientes sobre nuestros productos informáticos y servicio de soporte." />
    <title>Testimonios de Clientes</title>

    <link rel="shortcut icon" href="./img/imagen.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body>
    <main class="contenedor-principal">
      <h1 class="sr-only">Testimonios de nuestros clientes</h1>

      <article class="tarjeta-testimonio" id="tarjeta-testimonio">
        <!-- Botones de navegación -->
        <button class="btn-nav btn-prev" id="btn-prev" aria-label="Testimonio anterior">
          &#10094;
        </button>
        <button class="btn-nav btn-next" id="btn-next" aria-label="Siguiente testimonio">
          &#10095;
        </button>

        <!-- Avatar -->
        <div class="avatar-wrapper">
          <img
            src="./img/Foto3.jpg"
            alt="Foto de perfil de María Quiroga"
            class="avatar"
            id="avatar" />
        </div>

        <!-- Calificación -->
        <div
          class="estrellas"
          id="estrellas"
          role="img"
          aria-label="Calificación de 5 estrellas"></div>

        <!-- Contenido principal -->
        <blockquote class="texto" id="texto">
          <!-- Carga dinámicamente -->
        </blockquote>

        <!-- Información del cliente -->
        <div class="info-cliente">
          <h2 class="autor" id="autor">María Quiroga</h2>
          <span class="cargo" id="cargo">Cliente verificado</span>
        </div>

        <!-- Puntos/Dots de navegación -->
        <div class="dots-container" id="dots-container"></div>
      </article>
    </main>

    <script src="./js/index.js"></script>
  </body>
</html>
